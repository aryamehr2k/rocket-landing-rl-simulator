[build-system]
requires = ["setuptools==75.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rocketsim"
version = "0.1.0"
description = "Simulate, train and export a landing guidance policy for a small hobby rocket."
# numpy 1.26 has no wheels for Python 3.13 and stable-baselines3 2.4 needs numpy < 2.
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy==1.26.4",
    "pyyaml==6.0.2",
    "matplotlib==3.9.2",
]

[project.optional-dependencies]
train = [
    "gymnasium==1.0.0",
    "stable-baselines3==2.4.0",
    "torch==2.5.1",
]
export = [
    "onnx==1.17.0",
    "onnxruntime==1.20.1",
]
hil = [
    "pyserial==3.5",
]
dev = [
    "pytest==8.3.3",
]

[tool.setuptools.packages.find]
include = ["rocketsim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
