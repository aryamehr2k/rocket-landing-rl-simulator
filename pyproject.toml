[build-system]
requires = ["setuptools==75.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rocketsim"
version = "0.1.0"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Kay K Aryamehr"}]
description = "6-DOF simulator, PPO training and C flight code for an electric thrust-vectored hop vehicle and a small solid rocket."
# numpy 1.26 has no wheels for Python 3.13.
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy==1.26.4",
    "pyyaml==6.0.2",
    "matplotlib==3.9.2",
]

[project.optional-dependencies]
train = [
    "gymnasium==1.0.0",
    "torch==2.5.1",
]
export = [
    "onnx==1.17.0",
    "onnxruntime==1.20.1",
]
docs = [
    "reportlab==4.2.5",
]
dev = [
    "pytest==8.3.3",
]

[tool.setuptools.packages.find]
include = ["rocketsim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
